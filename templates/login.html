<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FacultyFlow AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 42px;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            border: 1px solid #e5e7eb;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .login-btn {
            width: 100%;
            border: none;

            padding: 14px;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
        }

        .flash {
            background: #fef2f2;
            color: #b91c1c;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .demo {
            margin-top: 22px;
            padding: 13px;

            background: #f9fafb;

            border-radius: 10px;

            text-align: center;

            font-size: 12px;

            color: #6b7280;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: #9ca3af;

            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            F
        </div>

        <h1>FacultyFlow AI</h1>

        <p class="subtitle">
            Intelligent Faculty Administration Assistant
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form action="/" method="POST">

            <div class="form-group">

                <label for="email">
                    Faculty Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login to FacultyFlow AI
            </button>

        </form>


        <div class="demo">
            Demo mode: enter any email and password
        </div>


        <div class="footer">
            FacultyFlow AI • Smart Faculty Management
        </div>

    </div>

</div>

</body>
</html>
